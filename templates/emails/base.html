<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;background:#f7f5f2;font-family:Helvetica,Arial,sans-serif;color:#2a2723;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f5f2;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;">
        <tr><td style="padding:28px 32px 8px;font-family:Georgia,serif;font-size:24px;color:#1d1b18;">{{ SITE_NAME }}</td></tr>
        <tr><td style="padding:8px 32px 28px;font-size:15px;line-height:1.6;">{% block content %}{% endblock %}</td></tr>
      </table>
      <p style="font-size:12px;color:#77716a;margin:16px 0 0;">{{ SITE_NAME }} · <a href="{{ SITE_URL }}" style="color:#8b5a3c;">{{ SITE_URL }}</a></p>
    </td></tr>
  </table>
</body></html>
