{% if ring.image %}
  <img src="{{ ring.image.url }}" alt="{{ ring.name }} — alliance {{ ring.get_color_display|lower }} {{ ring.carats }} carats" loading="lazy">
{% else %}
  <svg class="ring-visual ring-visual--{{ ring.color }}" viewBox="0 0 200 200" role="img" aria-label="{{ ring.name }}">
    <ellipse cx="100" cy="100" rx="70" ry="70" fill="none" stroke-width="{% widthratio ring.width_mm 1 4 %}"/>
  </svg>
{% endif %}
